<script>
let tutorialStage = 0;

let tutorialWaiting = false;

let dialogueLocked = false;

function loadGame(){

const save = localStorage.getItem("gardenopiaSave");

if(!save){

    tutorialStage = 1;

    return;

}

    const data = JSON.parse(save);
	tutorialStage = data.tutorialStage ?? 1;

    money = data.money;

    seeds.forEach((seed,i)=>{
        seed.owned = data.seeds[i].owned;
    });

    flowers.forEach((flower,i)=>{
        flower.owned = data.flowers[i].owned;
    });

    miscItems.forEach((item,i)=>{
        item.owned = data.miscItems[i].owned;
    });

    betterPots = data.betterPots;
    betterSoil = data.betterSoil;
    betterWater = data.betterWater;

currentOrder = data.currentOrder;

    moneyDisplay.innerHTML = "Money: $" + money;

    updateInventory();

    document.getElementById("daisyFlowerInv").innerHTML =
        "Daisies: " + flowers[0].owned;

    document.getElementById("tulipFlowerInv").innerHTML =
        "Tulips: " + flowers[1].owned;

    document.getElementById("sunflowerFlowerInv").innerHTML =
        "Sunflowers: " + flowers[2].owned;

    if(data.cells){

        data.cells.forEach((savedCell,index)=>{

            const cell = cells[index];

            cell.innerHTML = "";

            cell.dataset.occupied = savedCell.occupied;
            cell.dataset.state = savedCell.state;
            cell.dataset.plant = savedCell.plant;

            if(savedCell.image){

                const img = document.createElement("img");

                img.src = savedCell.image;

                cell.appendChild(img);

            }
			if(cell.dataset.state=="growing"){

    growPlant(cell);

}

if(cell.dataset.state=="stage2water"){

    finishGrowth(cell);

}

        });

    }

    renderUpgrades();
    renderOrders();

}
function saveGame(){

    const cellData = cells.map(cell => ({

        occupied: cell.dataset.occupied || "false",
        state: cell.dataset.state || "",
        plant: cell.dataset.plant || "",
        image: cell.querySelector("img")
            ? cell.querySelector("img").src
            : null
			

    }));

    const saveData = {
		tutorialStage: tutorialStage,
        money: money,

        seeds: seeds,

        flowers: flowers,

        miscItems: miscItems,

        betterPots: betterPots,
        betterSoil: betterSoil,
        betterWater: betterWater,

currentOrder: currentOrder,

cells: cellData

    };

    localStorage.setItem("gardenopiaSave", JSON.stringify(saveData));

}
function buyBetterPots(){

    if(money < 250) return;

    money -= 250;
    betterPots = true;

    moneyDisplay.innerHTML = "Money: $" + money;

    renderUpgrades();

}

function buyBetterSoil(){

    if(money < 300) return;

    money -= 300;
    betterSoil = true;

    moneyDisplay.innerHTML = "Money: $" + money;

    renderUpgrades();

}

function buyBetterWater(){

    if(money < 400) return;

    money -= 400;
    betterWater = true;

    moneyDisplay.innerHTML = "Money: $" + money;

    renderUpgrades();

}
let betterPots = false;
let betterSoil = false;
let betterWater = false;
const upgrades = [

    {
        name:"Better Pots",
        desc:"50% Faster Growth",
        price:100
    },

    {
        name:"Better Soil",
        desc:"+20% Order Value",
        price:150
    },

    {
        name:"Better Water",
        desc:"Plants Stay Watered",
        price:200
    }

];
function startOrderTimer(){

    if(orderTimer!=null) return;

    if(flowers[0].owned==0 &&
       flowers[1].owned==0 &&
       flowers[2].owned==0){

        return;

    }

    const waitTime=(Math.random()*20+20)*1000;

    orderTimer=setTimeout(function(){

        orderTimer=null;

        generateOrder();

    },waitTime);

}
let currentOrder = null;
function generateOrder(){

    if(currentOrder!=null) return;

    const available=[];

    if(flowers[0].owned>0) available.push(0);
    if(flowers[1].owned>0) available.push(1);
    if(flowers[2].owned>0) available.push(2);

    if(available.length==0){
		renderOrders();
        startOrderTimer();
        return;
    }

    const flowerIndex=available[Math.floor(Math.random()*available.length)];

    const flower=flowers[flowerIndex];

    const amount=Math.floor(Math.random()*flower.owned)+1;

    let priceEach=33;

    if(flower.name=="Tulip") priceEach=40;
    if(flower.name=="Sunflower") priceEach=55;

let reward = amount * priceEach;

if(betterSoil){

    reward = Math.floor(reward * 1.20);

}

currentOrder={

    flower:flower.name,
    index:flowerIndex,
    amount:amount,
    reward:reward

};

    renderOrders();
renderUpgrades();

}

function renderSeedShop(){

    const list=document.getElementById("seedList");

    list.innerHTML="";

    seeds.forEach((seed,index)=>{

        list.innerHTML+=`

        <div class="seedItem">

            <div class="seedInfo">
                ${seed.name} Seed - $${seed.price}
            </div>

            

            <button onclick="buySeed(${index})">
                Buy
            </button>

        </div>

        `;

    });

}

function buySeed(index){

    const seed = seeds[index];

    if(money >= seed.price){

        money -= seed.price;

        seed.owned++;

        moneyDisplay.innerHTML = "Money: $" + money;

        renderSeedShop();

        updateInventory();

        saveGame();

        if(tutorialStage==4 && index==0){

            tutorialStage=5;

}

startOrderTimer();

if(cell.dataset.state=="ready"){

function growPlant(cell){

    const plant=cell.dataset.plant;

    let stage2Sprite;
    let readySprite;
    let growTime;

    if(plant=="daisy"){

        stage2Sprite="sprites/potdaisy2.png";
        readySprite="sprites/potdaisyfinal.png";
        growTime = betterPots ? 5000 : 10000;

    }

    else if(plant=="tulip"){

        stage2Sprite="sprites/tulip2.png";
        readySprite="sprites/tulipfinal.png";
        growTime = betterPots ? 10000 : 20000;

    }

    else{

        stage2Sprite="sprites/sunflower2.png";
        readySprite="sprites/sunflowerfinal.png";
        growTime = betterPots ? 15000 : 30000;

    }

    setTimeout(function(){

        if(cell.dataset.state!="growing") return;

cell.querySelector("img").src = stage2Sprite;

cell.dataset.state = "needsWater";

saveGame();

    },growTime);

}
function finishGrowth(cell){

    let readySprite;
    let growTime;

    if(cell.dataset.plant=="daisy"){

        readySprite="sprites/potdaisyfinal.png";
        growTime = betterPots ? 5000 : 10000;

    }

    else if(cell.dataset.plant=="tulip"){

        readySprite="sprites/tulipfinal.png";
        growTime = betterPots ? 10000 : 20000;

    }

    else{

        readySprite="sprites/sunflowerfinal.png";
        growTime = betterPots ? 15000 : 30000;

    }

    setTimeout(function(){

        if(cell.dataset.state!="stage2water") return;

cell.querySelector("img").src = readySprite;

cell.dataset.state = "ready";

saveGame();

    },growTime);

}
function completeOrder(){

    if(currentOrder==null) return;

    if(flowers[currentOrder.index].owned<currentOrder.amount){

        alert("Not enough flowers!");

        return;

    }

    flowers[currentOrder.index].owned-=currentOrder.amount;

    money+=currentOrder.reward;

    moneyDisplay.innerHTML="Money: $"+money;

    document.getElementById("daisyFlowerInv").innerHTML =
    "Daisies: "+flowers[0].owned;

    document.getElementById("tulipFlowerInv").innerHTML =
    "Tulips: "+flowers[1].owned;

    document.getElementById("sunflowerFlowerInv").innerHTML =
    "Sunflowers: "+flowers[2].owned;

    currentOrder = null;

renderOrders();

startOrderTimer();

saveGame();

}
renderOrders();
function renderOrders(){

    const list=document.getElementById("ordersList");

    if(currentOrder==null){

        list.innerHTML="<p>No orders available.</p>";
        return;

    }

    list.innerHTML=`

        <p><b>${currentOrder.flower}</b></p>

        <p>Amount: ${currentOrder.amount}</p>

        <p>Reward: $${currentOrder.reward}</p>

        <button onclick="completeOrder()">
            Deliver
        </button>

    `;

}
function renderUpgrades(){

    const list=document.getElementById("upgradeList");

    list.innerHTML="";

    upgrades.forEach((upgrade,index)=>{

        let owned=false;

        if(index==0) owned=betterPots;
        if(index==1) owned=betterSoil;
        if(index==2) owned=betterWater;

        list.innerHTML+=`

        <div class="upgradeItem">

            <div class="upgradeInfo">

                <b>${upgrade.name}</b>

                <p>${upgrade.desc}</p>

                <p>$${upgrade.price}</p>

            </div>

            ${
                owned
                ?
                "<button disabled>Owned</button>"
                :
                `<button onclick="buyUpgrade(${index})">Buy</button>`
            }

        </div>

        `;

    });

}
function buyUpgrade(index){

    const upgrade=upgrades[index];

    if(money<upgrade.price){

        alert("Not enough money!");

        return;

    }

    money-=upgrade.price;

    moneyDisplay.innerHTML="Money: $"+money;

    if(index==0){

        betterPots=true;

    }

    if(index==1){

        betterSoil=true;

    }

    if(index==2){

        betterWater=true;

    }

    renderOrders();
	renderUpgrades();
	saveGame();

}

function startDialogue(dialogue, locked = false){

    tutorialDialogue.length = 0;

    dialogue.forEach(line => tutorialDialogue.push(line));

    dialogueIndex = 0;

    dialogueLocked = locked;

    guideBox.style.display = "block";

    currentFrames = talkFrames;

    if(dialogueLocked){
        guideNext.style.display = "none";
    }
    else{
        guideNext.style.display = "block";
    }

    showDialogue();

}
function showDialogue(){

    const line = tutorialDialogue[dialogueIndex];

    if(typeof line === "string"){

        guideText.innerHTML = line;

        guideNext.style.display = "block";

        dialogueLocked = false;

    }
    else{

        guideText.innerHTML = line.text;

        dialogueLocked = line.lock;

        guideNext.style.display = line.lock ? "none" : "block";

    }

}

document.getElementById("guideNext").onclick=function(){
